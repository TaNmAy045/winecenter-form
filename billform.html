<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache">
<title>Purchase Bill</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Telegram passes its theme colours; these are the fallbacks outside Telegram. */
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #f1f3f6);
    --text: var(--tg-theme-text-color, #15171a);
    --hint: var(--tg-theme-hint-color, #8a9099);
    --accent: var(--tg-theme-button-color, #2481cc);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --line: rgba(128, 128, 128, .25);
    --warn: #c7841a;
    --bad: #d14343;
    --good: #2e9e5b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: var(--tg-theme-bg-color, #17212b);
      --bg2: var(--tg-theme-secondary-bg-color, #0e1621);
      --text: var(--tg-theme-text-color, #f5f5f5);
      --hint: var(--tg-theme-hint-color, #7d8b99);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg2); color: var(--text);
    font: 16px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", sans-serif;
    -webkit-text-size-adjust: 100%; }
  main { max-width: 640px; margin: 0 auto; padding: 12px 12px 40px; }
  section { background: var(--bg); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
  h1 { margin: 0; font-size: 19px; }
  h2 { margin: 0 0 8px; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--hint); }
  .sub { color: var(--hint); font-size: 14px; margin-top: 2px; }
  .facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin-top: 10px; font-size: 15px; }
  .facts span:nth-child(odd) { color: var(--hint); }
  label { display: block; font-size: 13px; color: var(--hint); margin: 10px 0 4px; }
  input, select { width: 100%; font: inherit; color: var(--text); background: var(--bg2);
    border: 1px solid transparent; border-radius: 10px; padding: 11px 12px; min-height: 44px; outline: none; }
  input:focus, select:focus { border-color: var(--accent); }
  input.bad { border-color: var(--bad); }
  input.changed { border-color: var(--good); }
  details summary { color: var(--accent); font-size: 15px; cursor: pointer; padding: 6px 0; }
  .seg { display: flex; background: var(--bg2); border-radius: 10px; padding: 3px; }
  .seg button { flex: 1; border: 0; background: transparent; color: var(--text); font: inherit;
    padding: 9px 0; border-radius: 8px; min-height: 40px; }
  .seg button.on { background: var(--accent); color: var(--accent-text); }
  .row { display: flex; gap: 8px; } .row > * { flex: 1; min-width: 0; }
  .item { border-top: 1px solid var(--line); padding: 12px 0; }
  .item:first-child { border-top: 0; padding-top: 4px; }
  .item .name { font-weight: 600; }
  .item .meta { color: var(--hint); font-size: 14px; margin-top: 3px; }
  .item .flag { color: var(--warn); font-size: 13px; margin-top: 3px; }
  .item .rateRow { display: flex; gap: 10px; align-items: center; margin-top: 8px; }
  .item .rateRow input { flex: 1.3; }
  .item .amount { flex: 1; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .item .src { font-size: 12px; color: var(--hint); margin-top: 4px; }
  .item .src.last { color: var(--warn); }
  .tot { display: flex; justify-content: space-between; padding: 6px 0; font-variant-numeric: tabular-nums; }
  .tot.big { font-weight: 700; font-size: 19px; border-top: 1px solid var(--line); margin-top: 6px; padding-top: 10px; }
  .chip { border: 1px solid var(--line); background: transparent; color: var(--accent); font: inherit;
    font-size: 14px; border-radius: 999px; padding: 8px 12px; white-space: nowrap; }
  .inline { display: flex; gap: 8px; align-items: center; } .inline input { flex: 1; }
  .msg { font-size: 14px; margin-top: 8px; }
  .msg.bad { color: var(--bad); } .msg.good { color: var(--good); } .msg.warn { color: var(--warn); }
  #save { width: 100%; border: 0; border-radius: 12px; padding: 15px; font: inherit; font-weight: 700;
    background: var(--accent); color: var(--accent-text); margin-top: 4px; }
  #diag { color: var(--hint); font-size: 11px; margin-top: 14px; word-break: break-all; }
</style>
</head>
<body>
<main>
  <section>
    <h1 id="seller">Purchase bill</h1>
    <div class="sub" id="summary"></div>
    <div class="facts" id="facts"></div>
    <label for="inv">Invoice no (as printed on the bill)</label>
    <input id="inv" autocapitalize="characters" autocomplete="off" placeholder="e.g. SW27-2700">
    <details id="more">
      <summary>Change details</summary>
      <label for="party">Party</label>
      <select id="party"></select>
      <input id="partyOther" placeholder="type the supplier's name" style="display:none; margin-top:8px">
      <div class="row">
        <div><label for="date">Invoice date</label><input id="date" type="date"></div>
        <div><label for="tp">TP no</label><input id="tp" inputmode="numeric" pattern="[0-9]*"></div>
      </div>
      <label>Purchase</label>
      <div class="seg" id="mode"><button type="button" data-v="1">Credit</button><button type="button" data-v="0">Cash</button></div>
    </details>
  </section>

  <section>
    <h2>Check the box rates</h2>
    <div id="items"></div>
  </section>

  <section>
    <h2>Bill amount</h2>
    <div class="tot"><span>Gross</span><span id="gross">-</span></div>
    <label for="sch">Scheme (amount or %)</label>
    <input id="sch" inputmode="decimal" placeholder="0">
    <label for="cd">Cash discount, CD (amount or %)</label>
    <input id="cd" inputmode="decimal" placeholder="0">
    <label for="tcs">TCS (amount or %)</label>
    <div class="inline"><input id="tcs" inputmode="decimal"><button type="button" class="chip" id="tcs2">2%</button></div>
    <div class="tot big"><span>Net</span><span id="net">-</span></div>
    <label for="printed">Total printed on the bill</label>
    <input id="printed" inputmode="decimal" placeholder="to check the net against">
    <div id="check" class="msg"></div>
  </section>

  <div id="errors" class="msg bad"></div>
  <button id="save" type="button">Save bill</button>
  <div id="diag"></div>
</main>

<script>
"use strict";
const $ = id => document.getElementById(id);
const tg = window.Telegram && window.Telegram.WebApp;
const inTelegram = !!(tg && tg.platform && tg.platform !== "unknown");
if (inTelegram) {
  try {  // Telegram first, so its Save button works even if anything below fails
    tg.ready(); tg.expand();
    tg.MainButton.setParams({ text: "Save bill", is_visible: true, is_active: true });
    tg.MainButton.onClick(() => save());
  } catch (e) { /* the page's own Save button still works */ }
}

// The bot puts the bill in the link after "#", as b=<base64url JSON>; it never reaches the web host.
// Telegram adds its own &tgWebApp... parameters to the same part of the link, so pick out b= alone.
function readBill() {
  const parts = location.hash.slice(1).split("&");
  let data = parts.find(p => p.startsWith("b="));
  data = data ? decodeURIComponent(data.slice(2)) : "";
  if (!data) return null;
  const b64 = data.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((data.length + 3) % 4);
  const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  return JSON.parse(new TextDecoder().decode(bytes));
}
let bill = null, loadError = "";
try { bill = readBill(); } catch (e) { loadError = "Couldn't read the bill from the link: " + e.message; }
if (!bill && !loadError) loadError = "This form opened without a bill. Close it and tap 📝 Bill form in the bot again.";
bill = bill || { s: "Purchase bill", tp: "", inv: "", d: "", p: [], tcsp: 2, L: [] };
$("diag").textContent = "form v3 · " + (inTelegram ? "Telegram " + tg.platform + " " + tg.version : "browser") +
  " · link part " + location.hash.length + " chars, keys: " +
  location.hash.slice(1).split("&").map(p => p.split("=")[0]).join(",") + " · " + bill.L.length + " items";

const inr = x => "₹" + (Math.round(x * 100) / 100).toLocaleString("en-IN", { maximumFractionDigits: 2 });
const n0 = x => (x || 0).toLocaleString("en-IN");

// ---- what comes from the transport pass / bill: shown, not asked
const partyName = (bill.p.find(p => p[0] === bill.pc) || [null, bill.s])[1];
$("seller").textContent = partyName || bill.s;
$("summary").textContent = bill.L.length + " items · " + n0(bill.L.reduce((a, l) => a + (l[2] || 0), 0)) + " bottles";
const fmtDate = iso => iso ? iso.split("-").reverse().join("-") : "-";
let credit = bill.cr !== 0;
function showFacts() {
  const name = $("party").value ? $("party").selectedOptions[0].text : ($("partyOther").value || "-");
  $("seller").textContent = name;
  $("facts").innerHTML = "";
  for (const [k, v] of [["TP no", $("tp").value || "-"], ["Date", fmtDate($("date").value)], ["Purchase", credit ? "Credit" : "Cash"]]) {
    const a = document.createElement("span"); a.textContent = k;
    const b = document.createElement("span"); b.textContent = v;
    $("facts").append(a, b);
  }
}
$("inv").value = bill.inv || "";
$("date").value = bill.d || "";
$("tp").value = bill.tp || "";
for (const [code, name] of bill.p) $("party").add(new Option(name, code));
$("party").add(new Option("Other (type name)…", ""));
$("party").value = bill.pc || (bill.p[0] ? bill.p[0][0] : "");
$("party").addEventListener("change", () => { $("partyOther").style.display = $("party").value ? "none" : "block"; showFacts(); });
$("party").dispatchEvent(new Event("change"));
for (const b of $("mode").children) {
  b.classList.toggle("on", (b.dataset.v === "1") === credit);
  b.addEventListener("click", () => {
    credit = b.dataset.v === "1";
    for (const x of $("mode").children) x.classList.toggle("on", x === b);
    showFacts();
  });
}
for (const id of ["date", "tp", "partyOther"]) $(id).addEventListener("input", showFacts);
showFacts();

// ---- items: L = [name, batch, bottles, mrp, case, rate|null, last|null, flag|""]
bill.L.forEach((l, i) => {
  const [name, batch, bottles, mrp, cs, rate, last, flag] = l;
  const div = document.createElement("div");
  div.className = "item";
  div.innerHTML = '<div class="name"></div><div class="meta"></div>' + (flag ? '<div class="flag"></div>' : "") +
    '<div class="rateRow"><input class="rate" inputmode="decimal" aria-label="box rate"><div class="amount"></div></div>' +
    '<div class="src"></div>';
  div.querySelector(".name").textContent = (i + 1) + ". " + name;
  div.querySelector(".meta").textContent = [batch && "Batch " + batch, "MRP " + mrp, bottles + " btl", "case of " + cs].filter(Boolean).join(" · ");
  if (flag) div.querySelector(".flag").textContent = flag;
  const input = div.querySelector(".rate");
  const start = rate || last || "";
  input.value = start;
  input.dataset.start = start;
  const src = div.querySelector(".src");
  if (rate) src.textContent = "Box rate (case of " + cs + ") as read from the bill";
  else if (last) { src.textContent = "Last purchase rate (case of " + cs + ") – check against the bill"; src.classList.add("last"); }
  else { src.textContent = "No rate yet – type the box rate (case of " + cs + ")"; src.classList.add("last"); }
  $("items").appendChild(div);
});

// ---- totals, the bot's rules: CD on gross less scheme, TCS on that less CD (rounded up)
$("sch").value = bill.sch || "";
$("cd").value = bill.cd || "";
$("tcs").value = bill.tcs != null && bill.tcs !== "" ? bill.tcs : (bill.tcsp || 2) + "%";
$("printed").value = bill.net || "";
$("tcs2").addEventListener("click", () => { $("tcs").value = (bill.tcsp || 2) + "%"; update(); });

function amountOf(text, base, roundUp) {
  const t = String(text || "").replace(/[₹,\s]/g, "").toLowerCase();
  if (!t) return 0;
  const m = t.match(/^(\d+(?:\.\d+)?)(%|percent|pc)?$/);
  if (!m) return NaN;
  const v = parseFloat(m[1]);
  if (!m[2]) return v;
  const a = base * v / 100;
  return roundUp ? Math.ceil(a - 1e-9) : Math.round(a * 100) / 100;
}
function lines() {
  return [...$("items").children].map((div, i) => {
    const input = div.querySelector(".rate");
    const rv = input.value.replace(/[₹,\s]/g, "");
    const rate = rv === "" ? null : parseFloat(rv);
    const [, , bottles, , cs] = bill.L[i];
    return { div, input, rate, amount: rate > 0 ? Math.round(bottles * rate / cs) : null };
  });
}
function update() {
  let gross = 0, missing = 0;
  for (const l of lines()) {
    l.div.querySelector(".amount").textContent = l.amount != null ? inr(l.amount) : "–";
    l.input.classList.toggle("changed", l.input.value !== l.input.dataset.start);
    l.input.classList.toggle("bad", l.rate !== null && !(l.rate > 0));
    if (l.amount != null) gross += l.amount; else missing++;
  }
  const sch = amountOf($("sch").value, gross, false);
  const cd = amountOf($("cd").value, gross - sch, false);
  const tcs = amountOf($("tcs").value, gross - sch - cd, true);
  for (const [id, v] of [["sch", sch], ["cd", cd], ["tcs", tcs]]) $(id).classList.toggle("bad", isNaN(v));
  const net = Math.floor(gross - sch - cd + tcs + 0.5);
  $("gross").textContent = missing ? inr(gross) + " (" + missing + " without rate)" : inr(gross);
  $("net").textContent = isNaN(net) || missing ? "–" : inr(net);
  const printed = parseFloat(($("printed").value || "").replace(/[₹,\s]/g, ""));
  const check = $("check");
  if (missing) { check.textContent = "Type the missing box rates to see the net."; check.className = "msg warn"; }
  else if (!printed) { check.textContent = "Type the total printed on the bill to check the net."; check.className = "msg"; }
  else if (Math.abs(printed - net) <= 1) { check.textContent = "✓ Matches the printed total."; check.className = "msg good"; }
  else { check.textContent = "Differs from the printed total by " + inr(Math.abs(printed - net)) + ". Check the box rates, scheme and CD."; check.className = "msg warn"; }
}
document.addEventListener("input", update);
update();

// ---- save: send the answers to the bot; Telegram then closes the form
function collect() {
  const errors = [];
  if (!bill.id) errors.push(loadError || "This form has no bill.");
  if (!$("inv").value.trim()) errors.push("Type the invoice no.");
  if (!$("date").value) { errors.push("The invoice date is missing (Change details)."); $("more").open = true; }
  if (!$("party").value && !$("partyOther").value.trim()) { errors.push("Choose the party (Change details)."); $("more").open = true; }
  const ls = lines();
  ls.forEach((l, i) => { if (!(l.rate > 0)) errors.push(`Item ${i + 1}: box rate?`); });
  for (const id of ["sch", "cd", "tcs"]) if ($(id).classList.contains("bad")) errors.push(`${id.toUpperCase()}: an amount or a percentage like 2%.`);
  $("errors").textContent = errors.join(" ");
  if (errors.length) return null;
  return {
    id: bill.id, inv: $("inv").value.trim().toUpperCase(), d: $("date").value, tp: $("tp").value.trim(),
    pc: $("party").value, pn: $("partyOther").value.trim(), cr: credit ? 1 : 0,
    L: ls.map((l, i) => [bill.L[i][2], l.rate]),
    sch: $("sch").value.trim(), cd: $("cd").value.trim(), tcs: $("tcs").value.trim(), net: $("printed").value.trim()
  };
}
function save() {
  const data = collect();
  if (!data) {
    try { tg.HapticFeedback.notificationOccurred("error"); } catch (e) {}
    $("errors").scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }
  const text = JSON.stringify(data);
  if (inTelegram) tg.sendData(text);
  else { $("errors").className = "msg good"; $("errors").textContent = "Outside Telegram. Would send: " + text; }
}
$("save").addEventListener("click", save);
if (loadError) $("errors").textContent = loadError;
</script>
</body>
</html>
